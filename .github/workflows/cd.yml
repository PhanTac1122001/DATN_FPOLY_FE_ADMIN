name: CD

on:
    push:
        branches: ["main", "develop"]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-dev:
        name: Build Dev
        if: github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        environment: ioc-dev
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=develop
                      type=sha,prefix=,format=long

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
                      NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                      SENTRY_DSN=${{ secrets.SENTRY_DSN }}
                      SENTRY_ORG=${{ secrets.SENTRY_ORG }}
                      SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
                      SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                      NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
                      NEXT_PUBLIC_HOTLINE_NUMBER=${{ secrets.NEXT_PUBLIC_HOTLINE_NUMBER }}
                      NEXT_PUBLIC_FACEBOOK_PAGELINK=${{ secrets.NEXT_PUBLIC_FACEBOOK_PAGELINK }}
                      NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
                      NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    build-prod:
        name: Build Prod
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: ioc-prod
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=,format=long

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
                      NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                      SENTRY_DSN=${{ secrets.SENTRY_DSN }}
                      SENTRY_ORG=${{ secrets.SENTRY_ORG }}
                      SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
                      SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                      NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
                      NEXT_PUBLIC_HOTLINE_NUMBER=${{ secrets.NEXT_PUBLIC_HOTLINE_NUMBER }}
                      NEXT_PUBLIC_FACEBOOK_PAGELINK=${{ secrets.NEXT_PUBLIC_FACEBOOK_PAGELINK }}
                      NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
                      NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    deploy-dev:
        runs-on: ubuntu-latest
        needs: build-dev
        if: github.ref == 'refs/heads/develop'
        environment: ioc-dev

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Deploy to Dev VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_KEY }}
                  script: |
                      set -e
                      # Login to GHCR
                      echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      # Pull and Restart Frontend
                      cd ~/ioc
                      TAG=develop docker compose -f docker-compose.dev.yml pull frontend
                      TAG=develop docker compose -f docker-compose.dev.yml up -d --force-recreate frontend
                      docker image prune -f

    deploy-prod:
        runs-on: ubuntu-latest
        needs: build-prod
        if: github.ref == 'refs/heads/main'
        environment: ioc-prod

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Deploy to Production VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_KEY }}
                  script: |
                      set -e
                      # Login to GHCR
                      echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      # Pull and Restart Frontend
                      cd ~/ioc-prod
                      TAG=latest docker compose -f docker-compose.production.yml pull frontend
                      TAG=latest docker compose -f docker-compose.production.yml up -d --force-recreate frontend
                      docker image prune -f
